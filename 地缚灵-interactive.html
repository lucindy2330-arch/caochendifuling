<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>地缚灵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&family=Long+Cang&family=Zhi+Mang+Xing&display=swap" rel="stylesheet">
<style>
:root {
  /* Autumn desk palette */
  --bg-page: #1a1510;
  --desk-surface: #261e16;
  --desk-edge: #3a2e22;
  /* Paper */
  --paper-bg: #f5edd6;
  --paper-aged: #ece0c4;
  --paper-dark: #d8c9a8;
  --paper-shadow: rgba(60, 40, 20, 0.5);
  --paper-text: #4a3828;
  --paper-text-light: #6a5840;
  --inner-ink: #7a5a3a;
  /* Autumn accents */
  --autumn-gold: #c4943a;
  --autumn-orange: #c87840;
  --autumn-red: #a85030;
  --autumn-brown: #8a6840;
  --autumn-olive: #7a8a50;
  --autumn-amber: #d4a844;
  --autumn-crimson: #b85a40;
  /* Wax */
  --wax-red: #8b2020;
  --wax-dark: #6a1818;
  /* Typography */
  --serif: 'Noto Serif SC', 'Georgia', serif;
  --hand: 'Long Cang', 'Ma Shan Zheng', cursive;
  --brush: 'Zhi Mang Xing', 'Ma Shan Zheng', cursive;
  --xiaowei: 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
  /* Effects */
  --glow-warm: rgba(200, 148, 64, 0.3);
  --glow-gold: rgba(212, 168, 68, 0.25);
  --glow-amber: rgba(200, 120, 64, 0.2);
  --glow-crimson: rgba(184, 90, 64, 0.2);
  --glow-olive: rgba(122, 138, 80, 0.2);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html { font-size: 16px; -webkit-font-smoothing: antialiased; }

body {
  background: var(--bg-page);
  color: var(--paper-text);
  font-family: var(--serif);
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* ==================== DESK BACKGROUND ==================== */
.desk-bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(60, 40, 20, 0.35) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(50, 35, 15, 0.3) 0%, transparent 55%),
    linear-gradient(180deg, #1a1510 0%, #1e1812 40%, #261e16 100%);
  z-index: 0;
}

.dust-canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

/* ==================== READER CONTAINER ==================== */
.reader {
  position: relative;
  z-index: 2;
  max-width: 680px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 20px 16px 60px;
  display: flex;
  flex-direction: column;
}

/* ==================== HEADER BAR ==================== */
.reader-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(30, 24, 18, 0.92);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(100, 80, 50, 0.2);
  padding: 12px 20px;
  margin: -20px -16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.header-title {
  font-family: var(--brush);
  font-size: 22px;
  color: var(--autumn-gold);
  letter-spacing: 4px;
  text-shadow: 0 1px 4px rgba(200, 148, 58, 0.2);
}

.header-meta {
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--xiaowei);
  font-size: 12px;
  color: var(--autumn-brown);
  letter-spacing: 2px;
}
.header-progress {
  display: flex;
  align-items: center;
  gap: 4px;
}
.progress-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(120, 90, 50, 0.3);
  transition: background 0.4s, transform 0.4s;
}
.progress-dot.active {
  background: var(--autumn-gold);
  transform: scale(1.4);
}
.progress-dot.read {
  background: var(--autumn-brown);
}

/* ==================== CONTENT AREA ==================== */
.reader-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0;
}

/* ==================== ERA SEPARATOR ==================== */
.era-sep {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 28px 0 20px;
  gap: 14px;
  animation: fadeSlideUp 0.7s ease;
}
.era-sep::before,
.era-sep::after {
  content: '';
  flex: 1;
  max-width: 80px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--autumn-brown), transparent);
  opacity: 0.5;
}
.era-sep-label {
  font-family: var(--xiaowei);
  font-size: 13px;
  color: var(--autumn-gold);
  letter-spacing: 4px;
  white-space: nowrap;
  opacity: 0.85;
}

/* ==================== FOLDED PAPER (sealed state) ==================== */
.folded-paper {
  position: relative;
  max-width: 560px;
  margin: 0 auto 24px;
  cursor: pointer;
  animation: paperSlideIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.folded-paper:hover {
  transform: translateY(-4px) rotate(-0.3deg);
}
.folded-paper:active {
  transform: scale(0.99);
}

.paper-folded-body {
  position: relative;
  background:
    /* wrinkle lines */
    repeating-linear-gradient(172deg, transparent, transparent 22px, rgba(160, 130, 90, 0.05) 22px, rgba(160, 130, 90, 0.05) 23px),
    repeating-linear-gradient(188deg, transparent, transparent 28px, rgba(140, 110, 70, 0.04) 28px, rgba(140, 110, 70, 0.04) 29px),
    /* coffee stain */
    radial-gradient(ellipse at 80% 20%, rgba(180, 140, 80, 0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 15% 75%, rgba(160, 120, 70, 0.05) 0%, transparent 45%),
    /* age gradient */
    linear-gradient(135deg, var(--paper-bg) 0%, var(--paper-aged) 50%, var(--paper-dark) 100%);
  border-radius: 2px 4px 4px 2px;
  padding: 32px 28px 28px;
  box-shadow:
    0 6px 20px var(--paper-shadow),
    0 2px 6px rgba(0,0,0,0.3),
    inset 0 0 40px rgba(180, 150, 100, 0.08);
  border: 1px solid rgba(160, 130, 80, 0.15);
  overflow: hidden;
  /* folded look */
  transform: rotate(-0.5deg);
}

.paper-folded-body::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(5deg, transparent 48%, rgba(140, 110, 70, 0.06) 48%, rgba(140, 110, 70, 0.06) 49%, transparent 49%),
    linear-gradient(175deg, transparent 35%, rgba(150, 120, 80, 0.04) 35%, rgba(150, 120, 80, 0.04) 35.5%, transparent 35.5%),
    linear-gradient(168deg, transparent 62%, rgba(130, 100, 60, 0.05) 62%, rgba(130, 100, 60, 0.05) 62.5%, transparent 62.5%);
  pointer-events: none;
}

/* Fold crease in middle */
.paper-folded-body::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(120, 90, 50, 0.15), transparent);
  pointer-events: none;
}

.folded-time {
  text-align: center;
  font-family: var(--hand);
  font-size: 17px;
  color: var(--paper-text);
  margin-bottom: 20px;
  letter-spacing: 1px;
}

.folded-seal {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.seal-icon {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, var(--wax-red), var(--wax-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow:
    0 3px 10px rgba(0,0,0,0.4),
    inset 0 1px 3px rgba(255,200,200,0.2),
    inset 0 -3px 5px rgba(0,0,0,0.3);
  animation: sealPulse 3s ease-in-out infinite;
  position: relative;
}
.seal-icon::before {
  content: '';
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  border: 1px solid rgba(255,200,200,0.12);
}
.seal-char {
  font-family: var(--brush);
  font-size: 20px;
  color: rgba(255, 220, 200, 0.65);
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.seal-hint {
  font-family: var(--xiaowei);
  font-size: 12px;
  color: var(--paper-text-light);
  letter-spacing: 3px;
  opacity: 0.6;
  animation: hintFade 2.5s ease-in-out infinite;
}

/* Era color accent */
.folded-paper .paper-folded-body { border-left: 3px solid var(--autumn-gold); }
.folded-paper[data-era="dusk"] .paper-folded-body { border-left-color: var(--autumn-amber); }
.folded-paper[data-era="past-morning"] .paper-folded-body { border-left-color: var(--autumn-orange); }
.folded-paper[data-era="notes"] .paper-folded-body { border-left-color: var(--autumn-olive); }
.folded-paper[data-era="truth"] .paper-folded-body { border-left-color: var(--autumn-crimson); }
.folded-paper[data-era="moving"] .paper-folded-body { border-left-color: var(--autumn-brown); }
.folded-paper[data-era="walk"] .paper-folded-body { border-left-color: var(--autumn-orange); }

/* ==================== OPEN PAPER (content state) ==================== */
.open-paper {
  position: relative;
  max-width: 600px;
  margin: 0 auto 28px;
  background:
    /* subtle wrinkles */
    repeating-linear-gradient(174deg, transparent, transparent 30px, rgba(150, 120, 80, 0.03) 30px, rgba(150, 120, 80, 0.03) 31px),
    repeating-linear-gradient(186deg, transparent, transparent 38px, rgba(130, 100, 60, 0.025) 38px, rgba(130, 100, 60, 0.025) 39px),
    /* age spots */
    radial-gradient(ellipse at 85% 15%, rgba(180, 140, 80, 0.04) 0%, transparent 40%),
    radial-gradient(ellipse at 10% 85%, rgba(160, 120, 70, 0.035) 0%, transparent 35%),
    linear-gradient(135deg, var(--paper-bg) 0%, var(--paper-aged) 60%, var(--paper-dark) 100%);
  border-radius: 3px;
  padding: 36px 32px 32px;
  box-shadow:
    0 8px 28px var(--paper-shadow),
    0 2px 8px rgba(0,0,0,0.25),
    inset 0 0 50px rgba(180, 150, 100, 0.06);
  border: 1px solid rgba(160, 130, 80, 0.12);
  border-left: 3px solid var(--autumn-gold);
  animation: paperUnfold 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
  transform-origin: top center;
}

.open-paper[data-era="dusk"] { border-left-color: var(--autumn-amber); }
.open-paper[data-era="past-morning"] { border-left-color: var(--autumn-orange); }
.open-paper[data-era="notes"] { border-left-color: var(--autumn-olive); }
.open-paper[data-era="truth"] { border-left-color: var(--autumn-crimson); }
.open-paper[data-era="moving"] { border-left-color: var(--autumn-brown); }
.open-paper[data-era="walk"] { border-left-color: var(--autumn-orange); }

.open-paper::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(3deg, transparent 48%, rgba(140, 110, 70, 0.04) 48%, rgba(140, 110, 70, 0.04) 49%, transparent 49%),
    linear-gradient(177deg, transparent 30%, rgba(150, 120, 80, 0.03) 30%, rgba(150, 120, 80, 0.03) 30.5%, transparent 30.5%);
  pointer-events: none;
  border-radius: 3px;
}

.paper-header {
  text-align: center;
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid rgba(140, 110, 70, 0.15);
}
.paper-time {
  font-family: var(--hand);
  font-size: 16px;
  color: var(--paper-text);
  letter-spacing: 1px;
}

/* ==================== PROSE CONTENT ==================== */
.prose-block {
  margin-bottom: 14px;
  animation: inkSpread 0.6s ease forwards;
  opacity: 0;
}

.prose-paragraph {
  font-family: var(--serif);
  font-size: 15px;
  line-height: 2;
  color: var(--paper-text);
  text-indent: 2em;
  letter-spacing: 0.3px;
  text-align: justify;
}

.prose-inner {
  font-family: var(--serif);
  font-size: 14px;
  line-height: 1.9;
  color: var(--inner-ink);
  font-style: italic;
  text-indent: 2em;
  letter-spacing: 0.3px;
  padding: 6px 0 6px 16px;
  border-left: 2px solid rgba(140, 110, 70, 0.2);
  margin: 10px 0;
  opacity: 0.85;
  position: relative;
}
.prose-inner::before {
  content: '— ';
  color: var(--autumn-brown);
  opacity: 0.5;
}

.prose-image {
  font-family: var(--xiaowei);
  font-size: 13px;
  color: var(--paper-text-light);
  padding: 12px 16px;
  margin: 12px 0;
  border: 1px dashed rgba(140, 110, 70, 0.25);
  border-radius: 4px;
  background: rgba(180, 150, 100, 0.04);
  letter-spacing: 0.5px;
  line-height: 1.7;
}
.prose-image::before {
  content: '备忘 · ';
  font-family: var(--hand);
  color: var(--autumn-brown);
  opacity: 0.6;
}

/* ==================== NEXT PROMPT ==================== */
.next-prompt {
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 20px 0 8px;
  animation: fadeSlideUp 0.6s ease;
}
.next-btn {
  background: none;
  border: 1px solid rgba(200, 148, 58, 0.25);
  color: var(--autumn-gold);
  padding: 10px 32px;
  border-radius: 24px;
  font-family: var(--xiaowei);
  font-size: 13px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.next-btn:hover {
  border-color: rgba(200, 148, 58, 0.55);
  box-shadow: 0 0 24px rgba(200, 148, 58, 0.12);
  transform: translateY(-1px);
}

/* ==================== EFFECT OVERLAY ==================== */
.fx-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.fx-overlay.active { opacity: 1; }

.fx-overlay.warm {
  background: radial-gradient(ellipse at 50% 35%, var(--glow-warm), transparent 70%);
  animation: warmPulse 4s ease-in-out forwards;
}
.fx-overlay.gold {
  background: radial-gradient(ellipse at 55% 30%, var(--glow-gold), transparent 65%);
  animation: goldPulse 3.5s ease-in-out forwards;
}
.fx-overlay.amber {
  background: radial-gradient(ellipse at 45% 50%, var(--glow-amber), transparent 70%);
  animation: amberPulse 4s ease-in-out forwards;
}
.fx-overlay.crimson {
  background: radial-gradient(ellipse at 50% 50%, var(--glow-crimson), transparent 65%);
  animation: crimsonPulse 3.5s ease-in-out forwards;
}
.fx-overlay.olive {
  background: radial-gradient(ellipse at 50% 60%, var(--glow-olive), transparent 70%);
  animation: olivePulse 4s ease-in-out forwards;
}
.fx-overlay.desaturate {
  background: rgba(80, 70, 60, 0.12);
  animation: desaturateIn 5s ease forwards;
}

.reader.shake-light {
  animation: shakeLight 0.8s ease-in-out;
}

/* ==================== FALLING LEAVES ==================== */
.leaf {
  position: fixed;
  z-index: 40;
  pointer-events: none;
  font-size: 16px;
  opacity: 0;
  animation: leafFall linear forwards;
}

/* ==================== OPENING SCREEN ==================== */
.opening-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 70vh;
  text-align: center;
  padding: 40px 20px;
}
.opening-title {
  font-family: var(--brush);
  font-size: 56px;
  color: var(--autumn-gold);
  letter-spacing: 12px;
  margin-bottom: 16px;
  text-shadow: 0 2px 12px rgba(200, 148, 58, 0.25);
  animation: titleFadeIn 1.2s ease;
}
.opening-subtitle {
  font-family: var(--xiaowei);
  font-size: 14px;
  color: var(--autumn-brown);
  letter-spacing: 5px;
  margin-bottom: 48px;
  opacity: 0.6;
  animation: fadeSlideUp 1s ease 0.3s backwards;
}
.opening-btn {
  background: none;
  border: 1px solid rgba(200, 148, 58, 0.3);
  color: var(--autumn-gold);
  padding: 12px 40px;
  border-radius: 28px;
  font-family: var(--xiaowei);
  font-size: 14px;
  letter-spacing: 4px;
  cursor: pointer;
  transition: all 0.4s;
  animation: fadeSlideUp 1s ease 0.6s backwards;
}
.opening-btn:hover {
  border-color: rgba(200, 148, 58, 0.65);
  box-shadow: 0 0 30px rgba(200, 148, 58, 0.15);
  transform: translateY(-2px);
}

/* ==================== END SCREEN ==================== */
.end-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 50px 20px;
  animation: fadeSlideUp 1s ease;
}
.end-mark {
  font-family: var(--brush);
  font-size: 28px;
  color: var(--autumn-gold);
  letter-spacing: 6px;
  margin-bottom: 20px;
  opacity: 0.7;
}
.end-text {
  font-family: var(--hand);
  font-size: 20px;
  color: var(--paper-text-light);
  margin-bottom: 12px;
  line-height: 2;
  max-width: 400px;
}
.end-sub {
  font-family: var(--xiaowei);
  font-size: 12px;
  color: var(--autumn-brown);
  letter-spacing: 3px;
  margin-bottom: 36px;
  opacity: 0.5;
}
.end-btn {
  background: none;
  border: 1px solid rgba(200, 148, 58, 0.25);
  color: var(--autumn-gold);
  padding: 10px 36px;
  border-radius: 24px;
  font-family: var(--xiaowei);
  font-size: 13px;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s;
}
.end-btn:hover {
  border-color: rgba(200, 148, 58, 0.55);
  box-shadow: 0 0 24px rgba(200, 148, 58, 0.12);
}

/* ==================== ANIMATIONS ==================== */
@keyframes paperSlideIn {
  0% { opacity: 0; transform: translateY(40px) rotate(-1deg); }
  100% { opacity: 1; transform: translateY(0) rotate(0); }
}

@keyframes paperUnfold {
  0% { opacity: 0; transform: scaleY(0.6) scaleX(0.95); }
  60% { opacity: 0.9; transform: scaleY(1.01) scaleX(1); }
  100% { opacity: 1; transform: scaleY(1) scaleX(1); }
}

@keyframes inkSpread {
  0% { opacity: 0; transform: translateY(8px); filter: blur(2px); }
  60% { opacity: 0.7; filter: blur(0.5px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@keyframes sealPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

@keyframes hintFade {
  0%, 100% { opacity: 0.45; }
  50% { opacity: 0.85; }
}

@keyframes sealBreak {
  0% { transform: scale(1); opacity: 1; }
  40% { transform: scale(1.25) rotate(8deg); opacity: 0.7; }
  100% { transform: scale(0) rotate(25deg); opacity: 0; }
}

@keyframes fadeSlideUp {
  0% { opacity: 0; transform: translateY(16px); }
  100% { opacity: 1; transform: translateY(0); }
}

@keyframes titleFadeIn {
  0% { opacity: 0; transform: scale(0.9); letter-spacing: 4px; }
  100% { opacity: 1; transform: scale(1); letter-spacing: 12px; }
}

@keyframes warmPulse {
  0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 0.7; } 100% { opacity: 0; }
}
@keyframes goldPulse {
  0% { opacity: 0; } 10% { opacity: 1; } 60% { opacity: 0.6; } 100% { opacity: 0; }
}
@keyframes amberPulse {
  0% { opacity: 0; } 20% { opacity: 1; } 75% { opacity: 0.5; } 100% { opacity: 0; }
}
@keyframes crimsonPulse {
  0% { opacity: 0; } 15% { opacity: 1; } 65% { opacity: 0.45; } 100% { opacity: 0; }
}
@keyframes olivePulse {
  0% { opacity: 0; } 20% { opacity: 1; } 80% { opacity: 0.4; } 100% { opacity: 0; }
}
@keyframes desaturateIn {
  0% { opacity: 0; } 30% { opacity: 1; } 80% { opacity: 0.5; } 100% { opacity: 0; }
}

@keyframes shakeLight {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-4px) rotate(-0.5deg); }
  30% { transform: translateX(3px) rotate(0.3deg); }
  45% { transform: translateX(-2px); }
  60% { transform: translateX(2px); }
  75% { transform: translateX(-1px); }
}

@keyframes leafFall {
  0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.3; }
  100% { transform: translateY(105vh) translateX(100px) rotate(400deg); opacity: 0; }
}

/* ==================== REDUCED MOTION ==================== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ==================== MOBILE ==================== */
@media (max-width: 430px) {
  .reader { padding: 16px 12px 50px; }
  .reader-header { margin: -16px -12px 16px; padding: 10px 16px; }
  .header-title { font-size: 18px; letter-spacing: 3px; }
  .folded-paper, .open-paper { padding: 24px 20px; }
  .prose-paragraph { font-size: 14px; line-height: 1.9; }
  .prose-inner { font-size: 13px; }
  .opening-title { font-size: 40px; letter-spacing: 8px; }
}
</style>
</head>
<body>

      '走到巷口的时候，他终于说。',
      '"原谅归原谅，但有件事你最好搞清楚。"',
      '曹操回头。陈宫还飘在原地。',
      '"我不喜欢欠别人的东西。"他说，"尤其是人命。"',
      '陈宫看着他，忽然觉得有点哭笑不得。',
      '"行。"他说。',
      '曹操转回身，继续走。',
      '远处有放学的小学生成群结队地走过来，书包在背上一颠一颠的。夕阳把整个街道都染成了暖橘色。',
      '陈宫跟在他身后，不远不近，一米五的距离。'
    ]
  }
];

const eras = {
  'dawn':         { label: '初遇' },
  'dusk':         { label: '渐深' },
  'past-morning': { label: '寻觅' },
  'notes':        { label: '碎片' },
  'truth':        { label: '真相' },
  'moving':       { label: '新居' },
  'walk':         { label: '黄昏' }
};

// ==================== STATE ====================
let currentSegment = 0;
let isReading = false;
let currentEra = null;

const reader = document.getElementById('reader');
const readerBody = document.getElementById('readerBody');
const fxOverlay = document.getElementById('fxOverlay');
const headerCounter = document.getElementById('headerCounter');
const headerProgress = document.getElementById('headerProgress');
const openingScreen = document.getElementById('openingScreen');

// ==================== DUST PARTICLES ====================
const dustCanvas = document.getElementById('dustCanvas');
const ctx = dustCanvas.getContext('2d');
let dustParticles = [];

function initDust() {
  dustCanvas.width = window.innerWidth;
  dustCanvas.height = window.innerHeight;
  dustParticles = [];
  for (let i = 0; i < 35; i++) {
    dustParticles.push({
      x: Math.random() * dustCanvas.width,
      y: Math.random() * dustCanvas.height,
      size: Math.random() * 1.5 + 0.5,
      speedX: (Math.random() - 0.5) * 0.25,
      speedY: (Math.random() - 0.5) * 0.15 - 0.08,
      opacity: Math.random() * 0.25 + 0.08,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function animateDust() {
  ctx.clearRect(0, 0, dustCanvas.width, dustCanvas.height);
  const time = Date.now() * 0.001;
  dustParticles.forEach(p => {
    p.x += p.speedX + Math.sin(time + p.phase) * 0.08;
    p.y += p.speedY + Math.cos(time * 0.7 + p.phase) * 0.04;
    if (p.x < 0) p.x = dustCanvas.width;
    if (p.x > dustCanvas.width) p.x = 0;
    if (p.y < 0) p.y = dustCanvas.height;
    if (p.y > dustCanvas.height) p.y = 0;
    const flicker = 0.5 + 0.5 * Math.sin(time * 1.5 + p.phase);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(200, 168, 120, ${p.opacity * flicker})`;
    ctx.fill();
  });
  requestAnimationFrame(animateDust);
}

window.addEventListener('resize', () => {
  dustCanvas.width = window.innerWidth;
  dustCanvas.height = window.innerHeight;
});

initDust();
animateDust();

// ==================== PROGRESS DOTS ====================
function initProgressDots() {
  headerProgress.innerHTML = '';
  for (let i = 0; i < novelData.length; i++) {
    const dot = document.createElement('span');
    dot.className = 'progress-dot';
    headerProgress.appendChild(dot);
  }
}

function updateProgress() {
  const dots = headerProgress.querySelectorAll('.progress-dot');
  dots.forEach((dot, i) => {
    dot.classList.remove('active', 'read');
    if (i < currentSegment) dot.classList.add('read');
    else if (i === currentSegment) dot.classList.add('active');
  });
  headerCounter.textContent = `${currentSegment + 1} / ${novelData.length}`;
}

// ==================== FALLING LEAVES ====================
function createLeaves(count) {
  const leafChars = ['🍂', '🍁', '🍃'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const leaf = document.createElement('div');
      leaf.className = 'leaf';
      leaf.textContent = leafChars[Math.floor(Math.random() * leafChars.length)];
      leaf.style.left = Math.random() * 100 + 'vw';
      leaf.style.top = '-20px';
      leaf.style.fontSize = (14 + Math.random() * 16) + 'px';
      const duration = 5 + Math.random() * 7;
      leaf.style.animationDuration = duration + 's';
      leaf.style.animationDelay = Math.random() * 0.8 + 's';
      document.body.appendChild(leaf);
      setTimeout(() => leaf.remove(), (duration + 1.5) * 1000);
    }, i * 500);
  }
}

// ==================== EFFECTS ====================
function triggerStoryEffect(type, detail) {
  fxOverlay.className = 'fx-overlay';
  reader.classList.remove('shake-light');

  requestAnimationFrame(() => {
    if (['warm','gold','amber','crimson','olive'].includes(type)) {
      fxOverlay.classList.add(type, 'active');
      setTimeout(() => fxOverlay.classList.remove('active'), 4500);
    }
    if (type === 'desaturate') {
      fxOverlay.classList.add('desaturate', 'active');
      setTimeout(() => fxOverlay.classList.remove('active'), 5500);
    }
    if (detail === 'shake') {
      setTimeout(() => {
        reader.classList.add('shake-light');
        setTimeout(() => reader.classList.remove('shake-light'), 800);
      }, 600);
    }
    if (detail === 'leaves') {
      createLeaves(5);
    }
  });
}

// ==================== START ====================
function startReading() {
  openingScreen.style.transition = 'opacity 0.5s ease';
  openingScreen.style.opacity = '0';
  setTimeout(() => {
    openingScreen.style.display = 'none';
    renderSegment();
  }, 500);
}

// ==================== RENDER SEGMENT ====================
function renderSegment() {
  if (currentSegment >= novelData.length) {
    showEndScreen();
    return;
  }

  const data = novelData[currentSegment];
  const era = eras[data.era];

  // Era separator
  if (data.era !== currentEra) {
    currentEra = data.era;
    const sep = document.createElement('div');
    sep.className = 'era-sep';
    sep.innerHTML = `<span class="era-sep-label">${era.label}</span>`;
    readerBody.appendChild(sep);
  }

  // Create folded paper
  const paper = document.createElement('div');
  paper.className = 'folded-paper';
  paper.setAttribute('data-era', data.era);

  const sealChar = ['宫','灵','缚','忆','念','缘','尘','归'][Math.floor(Math.random() * 8)];

  paper.innerHTML = `
    <div class="paper-folded-body">
      <div class="folded-time">${data.time}</div>
      <div class="folded-seal">
        <div class="seal-icon"><span class="seal-char">${sealChar}</span></div>
        <div class="seal-hint">—— 点击展开 ——</div>
      </div>
    </div>
  `;

  paper.addEventListener('click', () => {
    if (isReading) return;
    openPaper(paper, data);
  });

  readerBody.appendChild(paper);
  updateProgress();
  scrollToView();
}

// ==================== OPEN PAPER ====================
function openPaper(paperEl, data) {
  isReading = true;

  // Break seal
  const seal = paperEl.querySelector('.seal-icon');
  const hint = paperEl.querySelector('.seal-hint');
  if (seal) seal.style.animation = 'sealBreak 0.4s ease forwards';
  if (hint) hint.style.opacity = '0';

  // Folded paper fades
  setTimeout(() => {
    paperEl.style.transition = 'all 0.5s ease';
    paperEl.style.opacity = '0';
    paperEl.style.transform = 'scale(0.96) translateY(8px)';
  }, 400);

  // Replace with open paper
  setTimeout(() => {
    paperEl.remove();

    const openPaper = document.createElement('div');
    openPaper.className = 'open-paper';
    openPaper.setAttribute('data-era', data.era);
    openPaper.innerHTML = `<div class="paper-header"><div class="paper-time">${data.time}</div></div>`;

    readerBody.appendChild(openPaper);

    // Trigger effect
    if (data.effect) {
      triggerStoryEffect(data.effect, data.effectDetail);
    }

    // Progressive reveal
    revealContent(openPaper, data.paragraphs, () => {
      isReading = false;
      currentSegment++;
      updateProgress();
      if (currentSegment < novelData.length) {
        showNextPrompt();
      } else {
        setTimeout(showEndScreen, 800);
      }
    });
  }, 900);
}

// ==================== REVEAL CONTENT ====================
function revealContent(paperEl, paragraphs, onComplete) {
  let index = 0;

  function showNext() {
    if (index >= paragraphs.length) {
      onComplete();
      return;
    }

    const p = paragraphs[index];
    const block = document.createElement('div');
    block.className = 'prose-block';

    if (typeof p === 'string') {
      const para = document.createElement('p');
      para.className = 'prose-paragraph';
      para.textContent = p;
      block.appendChild(para);
    } else if (p.type === 'inner-voice') {
      const inner = document.createElement('p');
      inner.className = 'prose-inner';
      inner.textContent = p.text;
      block.appendChild(inner);
    } else if (p.type === 'image') {
      const img = document.createElement('div');
      img.className = 'prose-image';
      img.textContent = p.text;
      block.appendChild(img);
    }

    paperEl.appendChild(block);
    scrollToView();

    index++;
    const delay = 350 + Math.random() * 450;
    setTimeout(showNext, delay);
  }

  showNext();
}

// ==================== NEXT PROMPT ====================
function showNextPrompt() {
  const prompt = document.createElement('div');
  prompt.className = 'next-prompt';
  const nextEra = eras[novelData[currentSegment].era];
  const btn = document.createElement('button');
  btn.className = 'next-btn';
  btn.textContent = `展开下一张 · ${nextEra.label}`;
  btn.addEventListener('click', () => {
    prompt.remove();
    renderSegment();
  });
  prompt.appendChild(btn);
  readerBody.appendChild(prompt);
  scrollToView();
}

// ==================== END SCREEN ====================
function showEndScreen() {
  const endDiv = document.createElement('div');
  endDiv.className = 'end-screen';
  endDiv.innerHTML = `
    <div class="end-mark">终</div>
    <div class="end-text">陈宫跟在他身后，不远不近，一米五的距离。</div>
    <div class="end-sub">—— 全文完 ——</div>
    <button class="end-btn" onclick="resetReading()">重新阅读</button>
  `;
  readerBody.appendChild(endDiv);
  scrollToView();
  createLeaves(10);
}

// ==================== RESET ====================
function resetReading() {
  currentSegment = 0;
  currentEra = null;
  isReading = false;
  readerBody.innerHTML = `
    <div class="opening-screen" id="openingScreen">
      <div class="opening-title">地缚灵</div>
      <div class="opening-subtitle">有 些 事 死 了 ， 也 一 了 百 了 不 了</div>
      <button class="opening-btn" onclick="startReading()">展开信纸</button>
    </div>
  `;
  updateProgress();
}

// ==================== SCROLL ====================
function scrollToView() {
  setTimeout(() => {
    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: 'smooth'
    });
  }, 80);
}

// ==================== INIT ====================
initProgressDots();
updateProgress();
</script>
</body>
</html>
